name: build
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - run: gh release download --repo pfusik/xasm --pattern xasm_*_amd64.deb --dir /tmp/pkg
      - run: sudo apt-get install -y /tmp/pkg/*.deb
      - uses: actions/checkout@main
      - run: make
